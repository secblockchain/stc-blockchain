name: Publish production Docker image

# GitHub ORs branches + tags in `on.push`. Publish only when BOTH are true:
# the ref is a v* tag, and that tag's commit is on main.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stc-geth

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main --prune
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Need a v* tag on main. ${GITHUB_REF_NAME} is not on main." >&2
            exit 1
          fi
          echo "Publishing ${GITHUB_REF_NAME} from main as ${IMAGE_NAME}:${GITHUB_REF_NAME} and ${IMAGE_NAME}:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILDNUM=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
