name: Enforce main source branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow develop into main
        if: github.head_ref != 'develop'
        run: |
          echo "Only the develop branch can be merged into main."
          echo "Source branch: ${{ github.head_ref }}"
          exit 1