version: '3.9'

services:
  eth:
    extends:
      file: ./services/eth.yml
      service: eth
    environment:
      - ACCOUNT_PRIVATE_KEY=${ACCOUNT_PRIVATE_KEY}
      - ACCOUNT_PASSWORD=${ACCOUNT_PASSWORD}

  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    depends_on:
      - eth
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_VARIANT: 'geth'
        ETHEREUM_JSONRPC_HTTP_URL: http://eth:8545
        ETHEREUM_JSONRPC_TRACE_URL: http://eth:8545
        ETHEREUM_JSONRPC_WS_URL: ws://eth:8546
        INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: 'false'
        INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: 'false'
        CHAIN_ID: '19515'

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy
