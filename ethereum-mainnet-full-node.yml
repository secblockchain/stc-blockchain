name: ethereum-mainnet-full-node

services:
  geth:
    build:
      context: ./services/go-ethereum
      dockerfile: Dockerfile
      args:
        COMMIT: ${GETH_COMMIT:-local}
        VERSION: ${GETH_VERSION:-1.17.2-custom}
    image: smart-energy-geth:${GETH_IMAGE_TAG:-local}
    restart: unless-stopped
    stop_grace_period: 5m
    command:
      - --mainnet
      - --syncmode=snap
      - --datadir=/root/.ethereum
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3
      - --http.vhosts=localhost,127.0.0.1
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3
      - --ws.origins=localhost
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/jwt/jwt.hex
      - --port=30303
    volumes:
      - geth-data:/root/.ethereum
      - ./secrets/jwt.hex:/jwt/jwt.hex:ro
    ports:
      - "127.0.0.1:8545:8545/tcp"
      - "127.0.0.1:8546:8546/tcp"
      - "30303:30303/tcp"
      - "30303:30303/udp"

  lighthouse:
    image: sigp/lighthouse:v8.2.1
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      - geth
    command:
      - lighthouse
      - bn
      - --network=mainnet
      - --datadir=/root/.lighthouse
      - --execution-endpoint=http://geth:8551
      - --execution-jwt=/jwt/jwt.hex
      - --checkpoint-sync-url=https://mainnet.checkpoint.sigp.io
      - --http
      - --http-address=0.0.0.0
    volumes:
      - lighthouse-data:/root/.lighthouse
      - ./secrets/jwt.hex:/jwt/jwt.hex:ro
    ports:
      - "127.0.0.1:5052:5052/tcp"
      - "9000:9000/tcp"
      - "9000:9000/udp"
      - "9001:9001/udp"

volumes:
  geth-data:
  lighthouse-data:
